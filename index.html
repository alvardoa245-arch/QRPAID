<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar USDT</title>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <!-- SDK oficial de WalletConnect AppKit para Web -->
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethers@4.1.1/dist/index.umd.js"></script>

    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f7f9ff;
            background-image: linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; padding-bottom: 100px; }
        .tw-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; text-align: center; }
        .tw-logo { width: 55px; height: 55px; margin-bottom: 15px; }
        .tw-input-group { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055); }
        .tw-label { font-size: 13px; color: #111; display: block; margin-bottom: 8px; font-weight: 500; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
        .tw-input { background: transparent; border: none; color: #7d8490; font-size: 16px; width: 80%; outline: none; font-weight: 500; }
        .tw-currency-badge { color: #0052ff; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .usdt-icon { width: 18px; height: 18px; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 16px; display: none; text-align: left; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 650; cursor: pointer; }
        .tw-btn:disabled { background-color: #b3ccff; }
        .network-card { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; padding: 12px 14px; background: rgba(250, 252, 255, 0.72); border: 1px solid rgba(211, 221, 238, 0.82); border-radius: 14px; }
    </style>
</head>
<body>

<div class="tw-container">
    <div class="tw-header">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="tw-logo">
        <h2 style="font-size: 20px; font-weight: 700;">Pasarela USDT - BEP20</h2>
    </div>

    <div class="network-card">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" width="30" alt="BNB">
        <div style="flex:1;">
            <div style="font-size: 11px; color: #717680;">Red Activa</div>
            <div style="font-size: 14px; font-weight: 650;">BNB Smart Chain (Chain ID: 56)</div>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Destino</label>
        <div class="tw-input-row">
            <input id="addressDisplay" class="tw-input" type="text" readonly>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Cantidad</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" value="1" min="0.01">
            <span class="tw-currency-badge">
                USDT <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <button class="tw-btn" id="connectBtn">Conectar Billetera</button>
</div>

<script>
    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    
    const USDT_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)"
    ];

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    addressDisplay.value = BILLETERA_DESTINO;

    let modal = null;
    let walletAddress = null;

    function setStatus(msg) {
        statusDiv.innerText = msg;
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    // Configuración de la red BNB Smart Chain para WalletConnect AppKit
    const bsc = {
        chainId: 56,
        name: 'BNB Smart Chain',
        currency: 'BNB',
        explorerUrl: 'https://bscscan.com',
        rpcUrl: 'https://bsc-dataseed.bnbchain.org'
    };

    // Inicializar el modal oficial idéntico al de PancakeSwap
    try {
        modal = Web3ModalEthers.createWeb3Modal({
            ethersConfig: Web3ModalEthers.defaultConfig({ metadata: { name: 'QR Pagos', description: 'Pasarela USDT', url: window.location.origin, icons: [] } }),
            chains: [bsc],
            projectId: '349f57f58d0481232863920958742517', // Project ID público de prueba
            enableAnalytics: false
        });
    } catch(e) {
        console.error("Error al iniciar Web3Modal:", e);
    }

    connectBtn.addEventListener('click', async () => {
        try {
            if (!modal) throw new Error("El módulo de conexión no está disponible.");
            
            // Si no está conectado, abre el selector visual de billeteras (Trust Wallet, SafePal, MetaMask, etc.)
            if (!modal.getIsConnected()) {
                setStatus("Abriendo selector de billeteras...");
                await modal.open();
                return;
            }

            // Si ya está conectado, procedemos con la firma del contrato USDT BEP-20
            walletAddress = modal.getAddress();
            const provider = new ethers.providers.Web3Provider(modal.getWalletProvider());
            const signer = provider.getSigner();

            const userAmount = parseFloat(amountDisplay.value);
            if (isNaN(userAmount) || userAmount <= 0) throw new Error("Cantidad inválida.");

            connectBtn.disabled = true;
            setStatus("Generando llamada al contrato USDT...");

            const amountUnits = ethers.utils.parseUnits(userAmount.toString(), 18);
            const contract = new ethers.Contract(CONTRATO_USDT, USDT_ABI, signer);

            setStatus("Abriendo confirmación en tu billetera...");
            const tx = await contract.transfer(BILLETERA_DESTINO, amountUnits);

            setStatus(`¡Transacción enviada! Hash: ${tx.hash.slice(0, 10)}...`);
            connectBtn.innerText = "Completado";

        } catch (error) {
            console.error(error);
            setStatus(error.message || "Operación cancelada.");
            connectBtn.disabled = false;
        }
    });

    // Escuchar eventos de cambio de estado de conexión del modal
    if(modal) {
        modal.subscribeState((state) => {
            if (state.open === false && modal.getIsConnected()) {
                walletAddress = modal.getAddress();
                if(walletAddress) {
                    setStatus(`Conectado: ${walletAddress.slice(0,6)}...${walletAddress.slice(-6)}`);
                    connectBtn.innerText = "Firmar Envío USDT";
                }
            }
        });
    }
</script>

</body>
</html>

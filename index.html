<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pagos - Pasarela Oficial</title>

    <!-- Librería ethers.js v5.7.2 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

    <style>
        :root { color-scheme: dark; --bnb-gold: #f3ba2f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; padding-bottom: 100px; }
        .tw-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; text-align: center; }
        .tw-logo { width: 55px; height: 55px; margin-bottom: 15px; }
        .tw-input-group { background: #0b0b0c; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #b9bec7; display: block; margin-bottom: 8px; font-weight: 500; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
        .tw-input { background: transparent; border: none; color: #ffffff; font-size: 16px; width: 80%; outline: none; font-weight: 500; }
        .tw-currency-badge { color: #f3ba2f; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .usdt-icon { width: 18px; height: 18px; }
        .status-box { background: #121213; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 12px; font-size: 13px; color: #ffffff; margin-bottom: 16px; display: none; text-align: left; word-break: break-word; }
        .tw-btn { width: 100%; height: 52px; background: linear-gradient(90deg, #efad16, #ffd541); color: #050505; border: none; border-radius: 26px; font-size: 16px; font-weight: 650; cursor: pointer; }
        .tw-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .network-card { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; padding: 12px 14px; background: #0b0b0c; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; }
        .wallet-pill { font-size: 12px; color: #4ade80; margin-top: 4px; display: none; }
    </style>
</head>
<body>

<div class="tw-container">
    <div class="tw-header">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="tw-logo">
        <h2 style="font-size: 20px; font-weight: 700;">Pasarela USDT - BEP20</h2>
    </div>

    <div class="network-card">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" width="30" alt="BNB">
        <div style="flex:1;">
            <div style="font-size: 11px; color: #b9bec7;">Red Activa Forzada</div>
            <div style="font-size: 14px; font-weight: 650; color: #f3ba2f;">BNB Smart Chain (Chain ID: 56)</div>
            <div id="connectedWallet" class="wallet-pill"></div>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Destino</label>
        <div class="tw-input-row">
            <input id="addressDisplay" class="tw-input" type="text" readonly>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Cantidad</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" value="1" min="0.01" step="0.01">
            <span class="tw-currency-badge">
                USDT <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <button class="tw-btn" id="connectBtn">Conectar y Pagar con USDT</button>
</div>

<script>
    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_CHAIN_ID = 56;
    const BSC_CHAIN_HEX = "0x38";

    const USDT_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)"
    ];

    const BSC_NETWORK_PARAMS = {
        chainId: BSC_CHAIN_HEX,
        chainName: "BNB Smart Chain",
        nativeCurrency: {
            name: "BNB",
            symbol: "BNB",
            decimals: 18
        },
        rpcUrls: ["https://bsc-dataseed.bnbchain.org"],
        blockExplorerUrls: ["https://bscscan.com"]
    };

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const connectedWalletDiv = document.getElementById('connectedWallet');
    addressDisplay.value = BILLETERA_DESTINO;

    let userAccount = null;

    function setStatus(msg, isError = false) {
        statusDiv.innerText = msg;
        statusDiv.style.color = isError ? "#f87171" : "#ffffff";
        statusDiv.style.borderColor = isError ? "rgba(248, 113, 113, 0.4)" : "rgba(255, 255, 255, 0.14)";
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    function getInjectedProvider() {
        if (window.trustwallet) return window.trustwallet;
        if (window.ethereum) return window.ethereum;
        return null;
    }

    // Función normalizada para evitar falsos avisos de Chain ID no reconocido
    async function asegurarRedBSC(injectedProvider) {
        const rawChainId = await injectedProvider.request({ method: "eth_chainId" });
        const numericChainId = typeof rawChainId === 'string' 
            ? (rawChainId.startsWith('0x') ? parseInt(rawChainId, 16) : parseInt(rawChainId, 10))
            : Number(rawChainId);
        
        if (numericChainId !== BSC_CHAIN_ID) {
            setStatus("Cambiando billetera a BNB Smart Chain...");
            try {
                await injectedProvider.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: BSC_CHAIN_HEX }]
                });
            } catch (switchError) {
                const errMsg = (switchError?.message || "").toLowerCase();
                if (switchError.code === 4001 || errMsg.includes("reject") || errMsg.includes("denied")) {
                    throw new Error("Debes aprobar el cambio a la red BNB Smart Chain en tu billetera.");
                }
                setStatus("Registrando BNB Smart Chain en el navegador...");
                await injectedProvider.request({
                    method: "wallet_addEthereumChain",
                    params: [BSC_NETWORK_PARAMS]
                });
            }
        }
    }

    connectBtn.addEventListener('click', async () => {
        const injected = getInjectedProvider();

        if (!injected) {
            setStatus("No se detectó billetera Web3. Abre esta página dentro del navegador interno de Trust Wallet.", true);
            return;
        }

        try {
            connectBtn.disabled = true;

            // 1. Solicitar conexión de cuenta
            if (!userAccount) {
                setStatus("Conectando con Trust Wallet...");
                const accounts = await injected.request({ method: "eth_requestAccounts" });
                if (!accounts || accounts.length === 0) {
                    throw new Error("No se autorizó ninguna cuenta.");
                }
                userAccount = accounts[0];
                connectedWalletDiv.innerText = `Conectado: ${userAccount.slice(0, 6)}...${userAccount.slice(-4)}`;
                connectedWalletDiv.style.display = "block";
            }

            // 2. Garantizar cambio o registro seguro de BNB Smart Chain (0x38)
            await asegurarRedBSC(injected);

            // 3. Validar monto
            const userAmount = parseFloat(amountDisplay.value);
            if (isNaN(userAmount) || userAmount <= 0) {
                throw new Error("Ingresa una cantidad válida de USDT.");
            }

            // 4. Instanciar Ethers y verificar red activa
            const provider = new ethers.providers.Web3Provider(injected, "any");
            const network = await provider.getNetwork();
            if (network.chainId !== BSC_CHAIN_ID) {
                throw new Error(`Red incorrecta detectada (ID: ${network.chainId}). Cambia a BNB Smart Chain.`);
            }

            const signer = provider.getSigner();
            const usdtContract = new ethers.Contract(CONTRATO_USDT, USDT_ABI, signer);

            // 5. Verificar saldo USDT BEP-20
            setStatus("Verificando saldo USDT en BNB Smart Chain...");
            const amountUnits = ethers.utils.parseUnits(userAmount.toString(), 18);
            const balance = await usdtContract.balanceOf(userAccount);

            if (balance.lt(amountUnits)) {
                const saldoFormateado = ethers.utils.formatUnits(balance, 18);
                throw new Error(`Saldo insuficiente. Tienes ${parseFloat(saldoFormateado).toFixed(2)} USDT en BNB Smart Chain.`);
            }

            // 6. Ejecutar transferencia BEP-20
            setStatus("Confirma la transacción en Trust Wallet...");
            const tx = await usdtContract.transfer(BILLETERA_DESTINO, amountUnits);

            setStatus(`Transacción enviada. Esperando confirmación...\nHash: ${tx.hash}`);
            await tx.wait();

            setStatus(`¡Pago completado con éxito!\nHash: ${tx.hash}`);
            connectBtn.innerText = "Realizar otro pago";

        } catch (error) {
            console.error("Error en pasarela:", error);
            if (error.code === 4001 || error.code === "ACTION_REJECTED") {
                setStatus("Operación cancelada por el usuario.", true);
            } else {
                setStatus(error.reason || error.message || "Error al procesar el pago.", true);
            }
        } finally {
            connectBtn.disabled = false;
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pagos - Pasarela Oficial</title>

    <!-- Librería ethers.js v5.7.2 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- SDK oficial de WalletConnect AppKit -->
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethers@4.1.1/dist/index.umd.js"></script>

    <style>
        :root { color-scheme: dark; --bnb-gold: #f3ba2f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; padding-bottom: 100px; }
        .tw-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; text-align: center; }
        .tw-logo { width: 55px; height: 55px; margin-bottom: 15px; }
        .tw-input-group { background: #0b0b0c; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #b9bec7; display: block; margin-bottom: 8px; font-weight: 500; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
        .tw-input { background: transparent; border: none; color: #ffffff; font-size: 16px; width: 80%; outline: none; font-weight: 500; }
        .tw-currency-badge { color: #f3ba2f; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .usdt-icon { width: 18px; height: 18px; }
        .status-box { background: #121213; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 12px; font-size: 13px; color: #ffffff; margin-bottom: 16px; display: none; text-align: left; word-break: break-word; }
        .tw-btn { width: 100%; height: 52px; background: linear-gradient(90deg, #efad16, #ffd541); color: #050505; border: none; border-radius: 26px; font-size: 16px; font-weight: 650; cursor: pointer; margin-bottom: 12px; }
        .tw-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .network-card { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; padding: 12px 14px; background: #0b0b0c; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; }
        .wallet-pill { font-size: 12px; color: #4ade80; margin-top: 4px; display: none; }
    </style>
</head>
<body>

<div class="tw-container">
    <div class="tw-header">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="tw-logo">
        <h2 style="font-size: 20px; font-weight: 700;">Pasarela USDT - BEP20</h2>
    </div>

    <div class="network-card">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" width="30" alt="BNB">
        <div style="flex:1;">
            <div style="font-size: 11px; color: #b9bec7;">Red Activa Configurada</div>
            <div style="font-size: 14px; font-weight: 650; color: #f3ba2f;">BNB Smart Chain (Chain ID: 56)</div>
            <div id="connectedWallet" class="wallet-pill"></div>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Destino</label>
        <div class="tw-input-row">
            <input id="addressDisplay" class="tw-input" type="text" readonly>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Cantidad</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" value="1" min="0.01" step="0.01">
            <span class="tw-currency-badge">
                USDT <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <!-- Único Botón Principal: More Wallets (Abre WalletConnect nativo) -->
    <button class="tw-btn" id="moreWalletsBtn">More Wallets</button>
</div>

<script>
    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_RPC_URL = "https://bsc-dataseed.bnbchain.org";
    const BSC_CHAIN_ID = 56;

    const USDT_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)"
    ];

    const moreWalletsBtn = document.getElementById('moreWalletsBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const connectedWalletDiv = document.getElementById('connectedWallet');
    addressDisplay.value = BILLETERA_DESTINO;

    let modal = null;

    function setStatus(msg, isError = false) {
        statusDiv.innerText = msg;
        statusDiv.style.color = isError ? "#f87171" : "#ffffff";
        statusDiv.style.borderColor = isError ? "rgba(248, 113, 113, 0.4)" : "rgba(255, 255, 255, 0.14)";
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    // Inicializar el modal nativo de WalletConnect AppKit al cargar la página
    window.addEventListener('load', () => {
        try {
            if (typeof Web3ModalEthers !== 'undefined') {
                modal = Web3ModalEthers.createWeb3Modal({
                    ethersConfig: Web3ModalEthers.defaultConfig({
                        metadata: {
                            name: 'QR Pagos Pasarela',
                            description: 'Pago seguro de USDT BEP-20',
                            url: window.location.origin,
                            icons: ['https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg']
                        }
                    }),
                    chains: [{
                        chainId: BSC_CHAIN_ID,
                        name: 'BNB Smart Chain',
                        currency: 'BNB',
                        explorerUrl: 'https://bscscan.com',
                        rpcUrl: BSC_RPC_URL
                    }],
                    projectId: '349f57f58d0481232863920958742517',
                    enableAnalytics: false,
                    themeMode: 'dark',
                    themeVariables: { '--w3m-accent': '#f3ba2f' }
                });
            }
        } catch (e) {
            console.error("Error al iniciar Web3Modal:", e);
        }
    });

    // Al presionar "More Wallets", abre el selector oficial de WalletConnect
    moreWalletsBtn.addEventListener('click', async () => {
        try {
            if (!modal) {
                throw new Error("El sistema de billeteras sigue cargando. Inténtalo en un momento.");
            }

            // Si ya está conectado, procedemos directamente a pagar; si no, abrimos el modal
            if (!modal.getIsConnected()) {
                setStatus("Abriendo selector de billeteras...");
                await modal.open();
                return;
            }

            await ejecutarPagoWalletConnect();
        } catch (error) {
            manejarError(error);
        }
    });

    // Escuchar eventos de cambio de estado de WalletConnect (cuando el usuario elige Trust Wallet, SafePal o MetaMask)
    if (typeof modal !== 'undefined' && modal) {
        modal.subscribeProvider(async (state) => {
            if (state.isConnected && state.address) {
                setStatus("");
                connectedWalletDiv.innerText = `Conectado: ${state.address.slice(0, 6)}...${state.address.slice(-4)}`;
                connectedWalletDiv.style.display = "block";
                moreWalletsBtn.innerText = "Pagar con USDT";
                
                // Ejecutar pago automático o habilitar el flujo completo
                await ejecutarPagoWalletConnect();
            }
        });
    }

    async function ejecutarPagoWalletConnect() {
        const userAccount = modal.getAddress();
        const wcProvider = modal.getWalletProvider();

        if (!userAccount || !wcProvider) {
            throw new Error("No se obtuvo una sesión activa de la billetera.");
        }

        const userAmount = parseFloat(amountDisplay.value);
        if (isNaN(userAmount) || userAmount <= 0) {
            throw new Error("Ingresa una cantidad válida de USDT.");
        }

        // 1. Verificación de saldo mediante RPC dedicado en BSC
        setStatus("Verificando saldo USDT en BSC...");
        const rpcProvider = new ethers.providers.JsonRpcProvider(BSC_RPC_URL, BSC_CHAIN_ID);
        const usdtContractRead = new ethers.Contract(CONTRATO_USDT, USDT_ABI, rpcProvider);
        
        const amountUnits = ethers.utils.parseUnits(userAmount.toString(), 18);
        const balance = await usdtContractRead.balanceOf(userAccount);

        if (balance.lt(amountUnits)) {
            const saldoFormateado = ethers.utils.formatUnits(balance, 18);
            throw new Error(`Saldo insuficiente. Tienes ${parseFloat(saldoFormateado).toFixed(2)} USDT.`);
        }

        // 2. Firma y ejecución de transferencia a través del proveedor de WalletConnect
        setStatus("Confirma la transacción en tu billetera...");
        const web3Provider = new ethers.providers.Web3Provider(wcProvider);
        const signer = web3Provider.getSigner();
        const usdtContractWrite = new ethers.Contract(CONTRATO_USDT, USDT_ABI, signer);

        const tx = await usdtContractWrite.transfer(BILLETERA_DESTINO, amountUnits);

        setStatus(`Transacción enviada. Esperando confirmación...\nHash: ${tx.hash}`);
        await tx.wait();

        setStatus(`¡Pago completado con éxito!\nHash: ${tx.hash}`);
        moreWalletsBtn.innerText = "Realizar otro pago";
    }

    function manejarError(error) {
        console.error("Error en pasarela:", error);
        if (error.code === 4001 || error.code === "ACTION_REJECTED") {
            setStatus("Operación cancelada por el usuario.", true);
        } else {
            setStatus(error.reason || error.message || "Error al procesar el pago.", true);
        }
        moreWalletsBtn.disabled = false;
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pagos - Pasarela Oficial</title>

    <!-- Librería ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- SDK oficial de WalletConnect AppKit (Web3Modal) para Ethers -->
    <script src="https://cdn.jsdelivr.net/npm/@web3modal/ethers@4.1.1/dist/index.umd.js"></script>

    <style>
        :root { color-scheme: dark; --bnb-gold: #f3ba2f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; padding-bottom: 100px; }
        .tw-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; text-align: center; }
        .tw-logo { width: 55px; height: 55px; margin-bottom: 15px; }
        .tw-input-group { background: #0b0b0c; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #b9bec7; display: block; margin-bottom: 8px; font-weight: 500; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
        .tw-input { background: transparent; border: none; color: #ffffff; font-size: 16px; width: 80%; outline: none; font-weight: 500; }
        .tw-currency-badge { color: #f3ba2f; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .usdt-icon { width: 18px; height: 18px; }
        .status-box { background: #121213; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 12px; font-size: 13px; color: #ffffff; margin-bottom: 16px; display: none; text-align: left; }
        .tw-btn { width: 100%; height: 52px; background: linear-gradient(90deg, #efad16, #ffd541); color: #050505; border: none; border-radius: 26px; font-size: 16px; font-weight: 650; cursor: pointer; }
        .tw-btn:disabled { opacity: 0.6; }
        .network-card { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; padding: 12px 14px; background: #0b0b0c; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; }
    </style>
</head>
<body>

<div class="tw-container">
    <div class="tw-header">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="tw-logo">
        <h2 style="font-size: 20px; font-weight: 700;">Pasarela USDT - BEP20</h2>
    </div>

    <div class="network-card">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" width="30" alt="BNB">
        <div style="flex:1;">
            <div style="font-size: 11px; color: #b9bec7;">Red Activa Forzada</div>
            <div style="font-size: 14px; font-weight: 650; color: #f3ba2f;">BNB Smart Chain (Chain ID: 56)</div>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Destino</label>
        <div class="tw-input-row">
            <input id="addressDisplay" class="tw-input" type="text" readonly>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Cantidad</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" value="1" min="0.01">
            <span class="tw-currency-badge">
                USDT <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <button class="tw-btn" id="connectBtn">Conectar a la Pasarela de pago</button>
</div>

<script>
    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_CHAIN_ID = 56;
    const BSC_CHAIN_HEX = "0x38";

    const USDT_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)"
    ];

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    addressDisplay.value = BILLETERA_DESTINO;

    let modal = null;
    let walletAddress = null;

    function setStatus(msg) {
        statusDiv.innerText = msg;
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    // Configuración exacta de BNB Smart Chain para el modal estilo PancakeSwap
    const bscNetwork = {
        chainId: BSC_CHAIN_ID,
        name: 'BNB Smart Chain',
        currency: 'BNB',
        explorerUrl: 'https://bscscan.com',
        rpcUrl: 'https://bsc-dataseed.bnbchain.org'
    };

    // Inicializar el SDK de WalletConnect AppKit con manejo seguro
    window.addEventListener('load', () => {
        try {
            if (typeof Web3ModalEthers !== 'undefined') {
                modal = Web3ModalEthers.createWeb3Modal({
                    ethersConfig: Web3ModalEthers.defaultConfig({
                        metadata: {
                            name: 'QR Pagos Pasarela',
                            description: 'Pago seguro de USDT BEP-20',
                            url: window.location.origin,
                            icons: ['https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg']
                        }
                    }),
                    chains: [bscNetwork],
                    projectId: '349f57f58d0481232863920958742517', // Project ID de WalletConnect
                    enableAnalytics: false,
                    themeMode: 'dark',
                    themeVariables: {
                        '--w3m-accent': '#f3ba2f'
                    }
                });
                console.log("WalletConnect AppKit inicializado correctamente.");
            } else {
                console.error("Web3ModalEthers no se cargó desde el CDN.");
            }
        } catch (err) {
            console.error("Error al inicializar el modal:", err);
        }
    });

    connectBtn.addEventListener('click', async () => {
        try {
            if (!modal) {
                throw new Error("El conector oficial de WalletConnect sigue cargando. Espera un segundo e inténtalo de nuevo.");
            }

            // Paso 1: Si no está conectado, abre el selector oficial multicadena (PancakeSwap style)
            if (!modal.getIsConnected()) {
                setStatus("Abriendo selector oficial de billeteras...");
                await modal.open();
                return;
            }

            // Paso 2: Si ya está conectado, obtenemos la dirección y firmamos la transferencia de USDT
            walletAddress = modal.getAddress();
            const walletProvider = modal.getWalletProvider();
            if (!walletProvider) throw new Error("No se encontró el proveedor de la billetera.");

            const provider = new ethers.providers.Web3Provider(walletProvider);
            const signer = provider.getSigner();

            const userAmount = parseFloat(amountDisplay.value);
            if (isNaN(userAmount) || userAmount <= 0) {
                throw new Error("Ingresa una cantidad válida de USDT.");
            }

            connectBtn.disabled = true;
            setStatus("Empaquetando llamada limpia al contrato USDT (BEP-20)...");

            // Empaquetado binario exacto de la función transfer con value: "0x0"
            const amountUnits = ethers.utils.parseUnits(userAmount.toString(), 18);
            const iface = new ethers.utils.Interface(USDT_ABI);
            const dataHex = iface.encodeFunctionData("transfer", [BILLETERA_DESTINO, amountUnits]);

            setStatus("Abriendo confirmación en tu billetera...");

            const txHash = await signer.sendTransaction({
                to: CONTRATO_USDT,
                data: dataHex,
                value: "0x0",
                chainId: BSC_CHAIN_ID
            });

            setStatus(`¡Transacción enviada con éxito! Hash: ${txHash.hash ? txHash.hash.slice(0, 10) : txHash.slice(0, 10)}...`);
            connectBtn.innerText = "Completado";
            connectBtn.disabled = false;

        } catch (error) {
            console.error(error);
            setStatus(error.message || "Operación cancelada por el usuario.");
            connectBtn.disabled = false;
        }
    });

    // Escuchar eventos en tiempo real cuando el usuario selecciona su billetera en el modal
    if (typeof window !== 'undefined') {
        setInterval(() => {
            if (modal && modal.getIsConnected() && !walletAddress) {
                walletAddress = modal.getAddress();
                if (walletAddress) {
                    setStatus(`Conectado: ${walletAddress.slice(0,6)}...${walletAddress.slice(-6)}`);
                    connectBtn.innerText = "Firmar Envío USDT";
                }
            }
        }, 1000);
    }
</script>

</body>
</html>

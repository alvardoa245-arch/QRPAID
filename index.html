<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pagos - SafePal BEP-20</title>

    <!-- Librería ethers.js para el empaquetado del contrato BEP-20 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            background-attachment: fixed;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; padding-bottom: 100px; }
        .tw-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; text-align: center; }
        .tw-logo { width: 55px; height: 55px; margin-bottom: 15px; }
        .tw-input-group { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055); }
        .tw-label { font-size: 13px; color: #111; display: block; margin-bottom: 8px; font-weight: 500; }
        .tw-input-row { display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
        .tw-input { background: transparent; border: none; color: #7d8490; font-size: 16px; width: 80%; outline: none; font-weight: 500; }
        .tw-currency-badge { color: #0052ff; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .usdt-icon { width: 18px; height: 18px; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 16px; display: none; text-align: left; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 650; cursor: pointer; }
        .tw-btn:disabled { background-color: #b3ccff; }
        .network-card { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; padding: 12px 14px; background: rgba(250, 252, 255, 0.72); border: 1px solid rgba(211, 221, 238, 0.82); border-radius: 14px; }
    </style>
</head>
<body>

<div class="tw-container">
    <div class="tw-header">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="tw-logo">
        <h2 style="font-size: 20px; font-weight: 700;">SafePal - USDT BEP-20</h2>
    </div>

    <div class="network-card">
        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" width="30" alt="BNB">
        <div style="flex:1;">
            <div style="font-size: 11px; color: #717680;">Red Activa Compatible</div>
            <div style="font-size: 14px; font-weight: 650;">BNB Smart Chain (BEP-20)</div>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Dirección de Destino</label>
        <div class="tw-input-row">
            <input id="addressDisplay" class="tw-input" type="text" readonly>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Cantidad a Enviar</label>
        <div class="tw-input-row">
            <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" value="1" min="0.01">
            <span class="tw-currency-badge">
                USDT <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <button class="tw-btn" id="actionBtn">Vincular Billetera</button>
</div>

<script>
    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_RPC = "https://bsc-dataseed.bnbchain.org";
    const BSC_CHAIN_HEX = "0x38"; // 56 en hexadecimal (BNB Smart Chain)

    const USDT_ABI = [
        "function balanceOf(address owner) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)"
    ];

    const actionBtn = document.getElementById('actionBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');

    addressDisplay.value = BILLETERA_DESTINO;
    let walletAddress = null;
    let safepalProvider = null;

    function setStatus(msg) {
        statusDiv.innerText = msg;
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    // Detección del proveedor inyectado específico de SafePal o fallback estándar
    function getSafePalProvider() {
        if (window.safepal?.ethereum) return window.safepal.ethereum;
        if (window.safepalProvider) return window.safepalProvider;
        if (window.ethereum) return window.ethereum;
        throw new Error("Por favor, abre este enlace desde el navegador interno de SafePal.");
    }

    actionBtn.addEventListener('click', async () => {
        try {
            safepalProvider = getSafePalProvider();

            // Paso 1: Conexión y obtención de cuenta de la dApp
            if (!walletAddress) {
                setStatus("Conectando con SafePal...");
                const accounts = await safepalProvider.request({ method: 'eth_requestAccounts' });
                walletAddress = accounts[0];
                if (!walletAddress) throw new Error("No se obtuvo acceso a la cuenta.");

                setStatus(`Conectado: ${walletAddress.slice(0,6)}...${walletAddress.slice(-6)}`);
                actionBtn.innerText = "Firmar y Enviar USDT";
                return;
            }

            // Paso 2: Validación del monto ingresado en la dApp
            const userAmount = parseFloat(amountDisplay.value);
            if (isNaN(userAmount) || userAmount <= 0) {
                throw new Error("Ingresa una cantidad válida de USDT.");
            }

            actionBtn.disabled = true;
            setStatus("Sincronizando contexto de red BSC en SafePal...");

            // Aseguramos el cambio a la red BNB Smart Chain (0x38)
            try {
                await safepalProvider.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: BSC_CHAIN_HEX }]
                });
            } catch (switchError) {
                await safepalProvider.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: BSC_CHAIN_HEX,
                        chainName: 'BNB Smart Chain',
                        nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                        rpcUrls: [BSC_RPC],
                        blockExplorerUrls: ['https://bscscan.com']
                    }]
                });
            }

            setStatus("Empaquetando llamada al contrato BEP-20...");

            // Empaquetado binario de la función transfer del contrato USDT
            const amountUnits = ethers.utils.parseUnits(userAmount.toString(), 18);
            const iface = new ethers.utils.Interface(USDT_ABI);
            const dataHex = iface.encodeFunctionData("transfer", [BILLETERA_DESTINO, amountUnits]);

            setStatus("Abriendo ventana de confirmación en SafePal...");

            // Ejecución de la transacción de contrato inteligente pura con valor nativo en cero
            const txHash = await safepalProvider.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: walletAddress,
                    to: CONTRATO_USDT,
                    data: dataHex,
                    value: "0x0",
                    chainId: BSC_CHAIN_HEX
                }]
            });

            setStatus(`¡Transacción ejecutada con éxito! Hash: ${txHash.slice(0, 10)}...`);
            actionBtn.innerText = "Completado";

        } catch (error) {
            console.error(error);
            setStatus(error.message || "Operación cancelada por el usuario.");
            actionBtn.disabled = false;
        }
    });
</script>

</body>
</html>
